<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica: Control de versiones | Gonzalez Gonzalez Brandon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Example Product List Web App</h1>

    <div class="student-info">
        <p class="activity">Práctica: Control de versiones</p>
        <p class="author">Desarrollado por: <strong>Gonzalez Gonzalez Brandon</strong></p>
    </div>

    <div class="container">

        <div class="formContainer">
            <label for="name">Product Name:</label>
            <input type="text" id="name" placeholder="Enter product name">
            
            <label for="price">Price:</label>
            <input type="number" id="price" placeholder="Enter product price" min="1">
            
            <button id="addProduct">Add Product</button>
        </div>

      
        <table id="productsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
          
            </tbody>
        </table>
    </div>


    <script src="functions.js"></script>
</body>
</html>
